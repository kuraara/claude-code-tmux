# Claude Code (tmux) stack for Portainer — deploy from this Git repo:
#   Stacks -> Add stack -> Repository
#     Repository URL:       <your git remote>
#     Repository reference: refs/heads/feature/tmux-auth-page  (main once merged)
#     Compose path:         docker-compose.yml
#   Environment variables: PUID, PGID (printed by setup-media-access.sh), TZ
#
# Host layout (all on the media disk):
#   /media/disk1/claude          -> /workspace        working directory
#   /media/disk1/claude/.home    -> $HOME             config, sign-in, history
#
# Sign-in page:  http://<nsg-l-ip>:8765
# Attach:        docker exec -it claude-code tmux attach -t claude

services:
  claude-code:
    build:
      context: .
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1500}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
    image: claude-code-tmux:local
    container_name: claude-code
    restart: unless-stopped
    init: true                     # reaps zombie processes from tmux/claude
    environment:
      - TZ=${TZ:-Australia/Perth}
      - CONTAINER_NAME=claude-code
      # Resume the last conversation on every start/restart (1 = on, 0 = off).
      # Falls back to a new conversation if there's nothing to resume.
      - CLAUDE_CONTINUE=${CLAUDE_CONTINUE:-1}
      # Optional extra flags for the claude command inside tmux:
      # - CLAUDE_ARGS=--model opus
      # Optional API-key auth instead of signing in (page then shows green):
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - /media/disk1/claude:/workspace
      - /opt/claude-context:/context
    ports:
      - "${AUTH_PAGE_HOST_PORT:-8765}:8765"
    # Optional: route the page through Traefik instead of / as well as the port.
    # networks: [traefik_proxy]
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.claude-auth.rule=Host(`claude.home.lan`)"
    #   - "traefik.http.routers.claude-auth.entrypoints=web"
    #   - "traefik.http.services.claude-auth.loadbalancer.server.port=8765"

